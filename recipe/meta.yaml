{% set name = "kubernetes" %}
{% set version = "37.0.2" %}

package:
  name: python-{{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6967599ef976d0bb9c663c3621e690db0e26fbab7cf5c5e3ccf7e11b790d2de9

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - pip
    - python
    - setuptools >=84.0.0
    - wheel
  run:
    - python
    - certifi >=2026.7.22
    - python-dateutil >=3.0.0
    - setuptools >=84.0.0
    - pyyaml >=6.0.3
    - websocket-client >=0.32.0,!=0.40.0,!=0.41.*,!=0.42.*
    - requests
    - requests-oauthlib
    - oauthlib >=4.0.0
    - urllib3 >=2.8.0,<3.0.0
    - durationpy >=0.11
    - pydantic >=2.14.2
    - typing_extensions >=4.16.0
  run_constrained:
    - google-auth >=1.0.1

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - kubernetes
    - kubernetes.client
    - kubernetes.client.apis
    - kubernetes.client.models
    - kubernetes.config
    - kubernetes.watch

about:
  home: https://github.com/kubernetes-client/python
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: The official Kubernetes python client.
  description: |
    The official Kubernetes python client. This is a client library for
    Kubernetes, an open-source container-orchestration system for automating
    computer application deployment, scaling, and management.
  dev_url: https://github.com/kubernetes-client/python
  doc_url: https://github.com/kubernetes-client/python/blob/master/README.md

extra:
  recipe-maintainers:
    - johanneskoester
    - ocefpaf
  skip-lints:
    - python_build_tools_in_host
